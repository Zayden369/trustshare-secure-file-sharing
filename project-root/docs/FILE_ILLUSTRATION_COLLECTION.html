<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrustShare illustration collection</title><style>/* TrustShare monochrome foundation. Semantic aliases keep feature APIs intact. */
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');
body.light{color-scheme:light}body.dark{color-scheme:dark}
:root,body.dark{--background:#080808;--surface-primary:#101010;--surface-secondary:#181818;--surface-hover:#222;--border:#2b2b2b;--text-primary:#f5f5f5;--text-secondary:#a6a6a6;--text-muted:#858585;--accent:#f5f5f5;--accent-contrast:#080808;--shadow-sm:0 1px 3px #0002;--shadow-md:0 8px 30px #0002;--shadow-lg:0 20px 60px #0003}
body.light{--background:#fafafa;--surface-primary:#fff;--surface-secondary:#f2f2f2;--surface-hover:#eaeaea;--border:#e1e1e1;--text-primary:#111;--text-secondary:#5f5f5f;--text-muted:#707070;--accent:#111;--accent-contrast:#fff;--shadow-sm:0 1px 3px #00000008;--shadow-md:0 8px 30px #00000008;--shadow-lg:0 20px 60px #0000000d}
body.dark,body.light{--font-sans:Inter,Arial,system-ui,sans-serif;--font-editorial:'Instrument Serif',Georgia,serif;--bg-primary:var(--background);--bg-secondary:var(--surface-primary);--bg-card:var(--surface-primary);--bg-hover:var(--surface-hover);--bg-input:var(--surface-secondary);--border-subtle:var(--border);--border-medium:var(--border);--border-accent:var(--text-muted);--brand-accent:var(--accent);--brand-soft:var(--surface-hover);--brand-on-accent:var(--accent-contrast);--focus-ring:var(--accent);--grad-primary:linear-gradient(var(--accent),var(--accent));--grad-success:linear-gradient(var(--text-primary),var(--text-secondary));--grad-bg:none;--shadow-blue:none;--radius-sm:3px;--radius-md:5px;--radius-lg:7px;--radius-xl:10px;--blue-400:var(--text-primary);--blue-500:var(--text-primary);--blue-600:var(--text-secondary);--purple-400:var(--text-primary);--purple-500:var(--text-secondary);--emerald-400:var(--text-primary);--emerald-500:var(--text-secondary);--rose-400:var(--text-primary);--rose-500:var(--text-secondary);--amber-400:var(--text-primary);--amber-500:var(--text-secondary);--cyan-400:var(--text-primary);--cyan-500:var(--text-secondary);--motion-fast:160ms;--motion-base:280ms;--motion-ease:cubic-bezier(.2,.75,.25,1);--transition:160ms cubic-bezier(.2,.75,.25,1)}

/* Phase II: neutral architecture with one brand signal and semantic status colors. */
:root,body.dark{--background:#09090b;--surface-primary:#141416;--surface-secondary:#1c1c20;--surface-hover:#242428;--border:#2d2d32;--border-strong:#414148;--text-primary:#f5f5f5;--text-secondary:#a6a6ad;--text-muted:#93939e;--accent:#a5b4fc;--accent-contrast:#111127;--success:#34d399;--warning:#fbbf24;--danger:#f87171}
body.light{--background:#f8f8fa;--surface-primary:#fff;--surface-secondary:#f1f1f4;--surface-hover:#eaeaef;--border:#e0e0e5;--border-strong:#c8c8d0;--text-primary:#141416;--text-secondary:#5f606a;--text-muted:#70717b;--accent:#4f46e5;--accent-contrast:#fff;--success:#047857;--warning:#b45309;--danger:#dc2626}
body.light,body.dark{--blue-400:var(--accent);--blue-500:var(--accent);--purple-400:var(--accent);--emerald-400:var(--success);--emerald-500:var(--success);--amber-400:var(--warning);--rose-400:var(--danger);--rose-500:var(--danger)}
.file-artwork{width:92px;height:100px;color:var(--text-secondary);fill:none;stroke:currentColor;stroke-width:1;overflow:visible}.file-artwork .file-artwork-shadow{fill:var(--surface-secondary);stroke:var(--border)}.file-artwork .file-artwork-paper{fill:var(--surface-primary);stroke:var(--text-muted)}.file-artwork text{font:9px var(--font-sans);stroke:none;fill:currentColor;letter-spacing:2px}.file-artwork.is-compact{width:35px;height:40px}.my-files-card-top>.file-artwork{transition:transform var(--motion-base) var(--motion-ease)}.my-files-file-card:hover .file-artwork{transform:translateY(-3px) rotate(-2deg)}
.folder-artwork{width:76px;height:60px;color:var(--text-secondary)}
.folder-artwork svg{width:100%;height:100%;overflow:visible;stroke:currentColor;stroke-width:.8;fill:var(--surface-secondary);transition:transform var(--motion-base) var(--motion-ease)}
.folder-artwork svg path:nth-child(2){fill:var(--surface-primary);filter:drop-shadow(1px 3px 1px #0000000c)}
.folder-artwork svg path:last-child{fill:none;opacity:.4}
.my-files-folder-card:hover .folder-artwork svg{transform:translateY(-3px) rotate(-2deg)}
@media(prefers-reduced-motion:reduce){.my-files-folder-card:hover .folder-artwork svg{transform:none}}

.file-artwork{--file-ink:var(--text-secondary);width:88px;height:88px}.file-artwork[data-kind=pdf]{--file-ink:#b95759}.file-artwork[data-kind=word]{--file-ink:#507fb5}.file-artwork[data-kind=slides]{--file-ink:#b27637}.file-artwork[data-kind=grid]{--file-ink:#428e70}.file-artwork[data-kind=video]{--file-ink:#827ac0}.file-artwork[data-kind=image]{--file-ink:#388e92}.file-artwork[data-kind=audio]{--file-ink:#9b739c}.file-artwork .art-layer{fill:var(--surface-secondary);stroke:var(--border-strong);transition:transform 220ms}.file-artwork .art-signal{stroke:var(--file-ink);fill:none}.file-artwork text.art-signal{fill:var(--file-ink);stroke:none;font-weight:650}.file-artwork .art-play{fill:var(--file-ink);stroke:none}.my-files-card:hover .art-layer{transform:translate(3px,-3px)}.my-files-card:hover .art-wave{animation:art-wave 600ms ease-in-out 1}.my-files-quick-btn--danger{color:var(--danger)}.my-files-card-title{font-size:14px;line-height:1.5}.my-files-card-meta{font-size:12px}.my-files-file-card.is-selected{border-color:var(--accent)}@keyframes art-wave{50%{transform:translateY(-3px)}}@media(prefers-reduced-motion:reduce){.file-artwork *{animation:none!important;transition:none!important}}

0"></rect></svg><p>XLSX</p></article><article><svg data-kind="video" class="file-artwork " viewBox="0 0 100 100" aria-hidden="true"><rect class="art-layer" x="12" y="24" width="74" height="53" rx="2"></rect><rect class="file-artwork-paper" x="8" y="19" width="74" height="53" rx="2"></rect><path class="art-signal art-play" d="M38 32l19 12-19 12z"></path><path d="M17 63h57"></path><circle class="art-signal" cx="33" cy="63" r="2"></circle></svg><p>MP4</p></article><article><svg data-kind="image" class="file-artwork " viewBox="0 0 100 100" aria-hidden="true"><rect class="art-layer" x="12" y="24" width="74" height="53" rx="2"></rect><rect class="file-artwork-paper" x="8" y="19" width="74" height="53" rx="2"></rect><circle class="art-signal" cx="61" cy="34" r="5"></circle><path class="art-signal" d="M17 61l17-20 15 16 9-9 16 13z"></path></svg><p>PNG</p></article><article><svg data-kind="audio" class="file-artwork " viewBox="0 0 100 100" aria-hidden="true"><circle class="file-artwork-paper" cx="48" cy="48" r="33"></circle><circle cx="48" cy="48" r="12"></circle><path class="art-signal art-wave" d="M17 48h7l4-12 6 25 7-34 7 43 6-32 5 18 5-8h15"></path></svg><p>MP3</p></article><article><svg data-kind="archive" class="file-artwork " viewBox="0 0 100 100" aria-hidden="true"><path class="file-artwork-paper" d="M14 28l35-15 35 15v43L49 88 14 71zM14 28l35 17 35-17M49 45v43"></path><path class="art-signal" d="M43 23l14 7-14 7 14 7M42 59h14v9H42z"></path></svg><p>ZIP</p></article><article><svg data-kind="code" class="file-artwork " viewBox="0 0 100 100" aria-hidden="true"><path class="art-layer" d="M27 15h47l12 14v63H27z"></path><path class="file-artwork-paper" d="M19 8h44l17 17v61H19zM63 8v18h17"></path><path class="art-signal" d="M39 37L28 48l11 11M58 37l11 11-11 11M53 31L44 65"></path><path d="M29 75h27"></path></svg><p>JSON</p></article><article><svg data-kind="document" class="file-artwork " viewBox="0 0 100 100" aria-hidden="true"><path class="art-layer" d="M27 15h47l12 14v6
